[project]
name = "board-agent-backend"
version = "0.1.0"
description = "看板 Agent 后端（FastAPI + LangChain Deep Agents）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0.54",
    "asyncpg>=0.31.0",
    "alembic>=1.20.0",
    "pymilvus>=3.0.1",
    "greenlet>=3.5.6",
    "python-multipart>=0.0.32",
    "aiosmtplib>=5.1.3",
    "deepagents>=0.7.15",
    "langchain-openai>=1.6.2",
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg[binary]>=3.3.5",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.uv]
package = false

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# B008: FastAPI 的 Form/File/Depends 在参数默认值中调用是标准写法
ignore = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
